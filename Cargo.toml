[package]
name = "population-epidemiology"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded population-epidemiology research evaluator"
license = "MIT"
# Release artifacts, patch series and timing evidence stay out of the source distribution.
exclude = [
  "/packages/",
  "/patches/",
  "/evidence/performance-0.3.0/",
  "/evidence/release-*/",
  "/SHA256SUMS",
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "float_roundtrip"] }
sha2 = "=0.10.9"
libm = "=0.2.15"
pyo3 = { version = "=0.29.0", optional = true, features = ["abi3-py310"] }
crn-craft = { path = "vendor/crn-craft/crates/crn-craft" }
