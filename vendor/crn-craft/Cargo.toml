[workspace]
members = ["crates/crn-craft"]
resolver = "3"

[workspace.package]
version = "0.2.0-dev.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip: decimal literals parse to the correctly rounded double.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
serde_path_to_error = "=0.1.20"
schemars = "=0.8.22"
sha2 = "=0.10.9"
libm = "=0.2.15"
rand_chacha = { version = "=0.3.1", default-features = false, features = ["std"] }
rand_core = { version = "=0.6.4", default-features = false }
crn-craft = { path = "crates/crn-craft" }
crn-craft-rules = { path = "crates/crn-craft-rules" }

[workspace.lints.rust]
unsafe_code = "forbid"
