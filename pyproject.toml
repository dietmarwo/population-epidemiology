[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "population-epidemiology"
version = "0.3.0"
requires-python = ">=3.10"
description = "Python API for Rust stochastic population models: SIR via finite state projection, neutral Moran drift and two-state rate calendars"
keywords = ["epidemiology", "SIR model", "finite state projection", "Moran process", "stochastic processes", "population dynamics", "simulation", "Rust"]

[project.urls]
Repository = "https://github.com/dietmarwo/population-epidemiology"

[tool.maturin]
module-name = "population_epidemiology._native"
python-source = "python"
features = ["python"]
include = [
  { path = "models/*.json", format = "sdist" },
  { path = "docs/*.md", format = "sdist" },
  { path = "validation/*.py", format = "sdist" },
]
