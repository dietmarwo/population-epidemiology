[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "population-epidemiology"
version = "0.3.0"
requires-python = ">=3.10"
description = "Prepared population-epidemiology research evaluations"

[tool.maturin]
module-name = "population_epidemiology._native"
python-source = "python"
features = ["python"]
include = [
  { path = "vendor/crn-craft/**/*", format = "sdist" },
  { path = "models/*.json", format = "sdist" },
  { path = "docs/*.md", format = "sdist" },
  { path = "validation/*.py", format = "sdist" },
]
exclude = [
  { path = "vendor/crn-craft/target/**/*", format = "sdist" },
]
